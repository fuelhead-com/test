---
name: Create Overlay VLAN

on:
  workflow_dispatch:
    inputs:
      id:
        description: "VLAN ID"
        required: true
        type: number

      name:
        description: "VLAN name"
        required: true
        type: string

      description:
        description: "VLAN description"
        required: false
        type: string

      targets:
        description: "Target groups"
        required: true
        type: choice
        options:
          - all_leafs
          - site_a_leafs
          - site_b_leafs
          - site_a_leafs site_b_leafs

      igmp_snooping:
        description: Enable igmp snooping
        required: true
        type: boolean
        default: false

      vlan_tag_standard:
        description: "Tag VLAN on port profile standard"
        required: true
        type: boolean
        default: true

      vlan_tag_devops:
        description: "Tag VLAN on port profile DevOps"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-vlan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a #v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r actions/create_overlay_vlan/requirements.txt

      - name: Create Overlay VLAN
        run: |
          python actions/create_overlay_vlan/create_overlay_vlan.py \
            --id "${{ inputs.id }}" \
            --name "${{ inputs.name }}" \
            --description "${{ inputs.description }}" \
            --igmp-snooping "${{ inputs.igmp_snooping }}" \
            --targets ${{ inputs.targets }} \
            --vlan-tag-standard "${{ inputs.vlan_tag_standard }}" \
            --vlan-tag-devops "${{ inputs.vlan_tag_devops }}"

      - name: Show generated file
        run: |
          cat "ansible/network_data/vlans/overlay/${{ inputs.id }}.yml"

      - name: Create branch
        run: |
          git checkout -b "create-overlay-vlan-${{ inputs.id }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "ansible/network_data/vlans/overlay/${{ inputs.id }}.yml"
          git commit -m "Create overlay VLAN ${{ inputs.id }}"

      - name: Push branch
        run: |
          git push origin "create-overlay-vlan-${{ inputs.id }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "create-overlay-vlan-${{ inputs.id }}" \
            --title "Create overlay VLAN ${{ inputs.id }}" \
            --body "This PR was automatically created by the Create Overlay VLAN workflow."
