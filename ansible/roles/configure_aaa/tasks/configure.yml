- name: Patch AAA global config
  vars:
    code:
      - 204
  ansible.builtin.uri:
    url: "{{ baseurl }}/system"
    method: patch
    headers:
      Cookie: "{{ login.cookies_string }}"
    body_format: json
    body: "{{ system_aaa_config.required }}"
    status_code: "{{ code }}"
    validate_certs: false
  register: response
  changed_when: response.status in code
  delegate_to: localhost
  when: system_aaa_config.required != system_aaa_config.configured

- name: Patch TACACS key
  vars:
    body:
      aaa:
        tacacs_passkey: "{{ aaa.tacacs_passkey }}"
    code:
      - 204
  ansible.builtin.uri:
    url: "{{ baseurl }}/system"
    method: patch
    headers:
      Cookie: "{{ login.cookies_string }}"
    body_format: json
    body: "{{ body }}"
    status_code: "{{ code }}"
    validate_certs: false
  register: response
  changed_when: response.status in code
  delegate_to: localhost
  when:
    - aaa.tacacs_passkey is defined
    - >-
      get_aaa_config.aaa.tacacs_passkey is not defined
      or aaa.update_tacacs_passkey | default(false) | bool

- name: Post AAA server groups
  vars:
    body: "{{ item.value.body }}"
    url: "{{ item.value.url }}"
    code: 
      - 201
  ansible.builtin.uri:
    url: "{{ url }}"
    method: post
    headers:
      Cookie: "{{ login.cookies_string }}"
    body_format: json
    status_code: "{{ code }}"
    body: "{{ body }}"
    validate_certs: false
  register: response
  changed_when: response.status in code
  delegate_to: localhost
  loop: "{{ generate_aaa_server_groups_config.post | default({}) | dict2items }}"
  loop_control:
    label: "Group: {{ item.key }}"

