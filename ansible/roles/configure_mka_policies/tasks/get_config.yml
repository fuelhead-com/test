---
- name: Get MKA policies
  ansible.builtin.uri:
    url: "{{ baseurl }}/system/mka_policies/%2A?selector=writable"
    method: get
    headers:
      Cookie: "{{ login.cookies_string }}"
    status_code: 
      - 200
      - 404
    validate_certs: false
  register: get_mka_policies
  delegate_to: localhost
  ignore_errors: true

- name: Remove json key
  ansible.builtin.set_fact:
    get_mka_policies: "{{ get_mka_policies.json | default({}) }}"