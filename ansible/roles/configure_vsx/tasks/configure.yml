---
- name: Post VSX
  vars:
    body: "{{ generate_vsx_config.post.body }}"
    url: "{{ generate_vsx_config.post.url }}"
    code: 
      - 201
  ansible.builtin.uri:
    url: "{{ url }}"
    method: post
    headers:
      Cookie: "{{ login.cookies_string }}"
    body_format: json
    status_code: "{{ code }}"
    body: "{{ body }}"
    validate_certs: false
  register: response
  changed_when: response.status in code
  delegate_to: localhost
  when: generate_vsx_config.post | default({})

- name: Put VSX
  vars:
    body: "{{ generate_vsx_config.put.body }}"
    url: "{{ generate_vsx_config.put.url }}"
    code: 
      - 200
      - 204
  ansible.builtin.uri:
    url: "{{ url }}"
    method: put
    headers:
      Cookie: "{{ login.cookies_string }}"
    body_format: json
    status_code: "{{ code }}"
    body: "{{ body }}"
    validate_certs: false
  register: response
  changed_when: response.status in code
  delegate_to: localhost
  when: generate_vsx_config.put | default({})

- name: Delete VSX
  vars:
    url: "{{ generate_vsx_config.delete.url }}"
    code: 
      - 204
  ansible.builtin.uri:
    url: "{{ url }}"
    method: delete
    headers:
      Cookie: "{{ login.cookies_string }}"
    status_code: "{{ code }}"
    validate_certs: false
  register: response
  changed_when: response.status in code
  delegate_to: localhost
  when: generate_vsx_config.delete | default({})